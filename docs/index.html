<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>دستیار پوست زویتر</title>
<meta name="description" content="سؤال‌های پوستی‌ات را از دستیار مهربان زویتر بپرس">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2371357B' d='M12 3C8.5 8 9 13 12 17c3-4 3.500-9 0-14zM5 7c0 5 3 9 7 10-2-4-3.500-8-7-10zm14 0c0 5-3 9-7 10 2-4 3.500-8 7-10z'/%3E%3Ccircle cx='12' cy='14' r='1.300' fill='%23F2994A'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("fonts/Vazirmatn-subset.woff2") format("woff2");
    font-weight: 300 700;
    font-display: swap;
  }
  :root {
    --plum: #71357B;        /* لوگو و برچسب محصولات */
    --plum-deep: #4A2352;
    --ink: #2A2340;         /* سرمه‌ای-آلویی برای متن */
    --mist: #F5EDFA;        /* حباب ربات */
    --lilac: #E4D6F2;
    --rose: #C76D9F;        /* برچسب تونر */
    --blush: #FCEFF5;
    --blush-edge: #EBC3D7;
    --saffron: #F2994A;
    --muted: #7C6B88;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 2;
    -webkit-text-size-adjust: 100%;
  }
  /* هاله‌ی یاسی بالای صفحه، مثل پس‌زمینه‌ی کاتالوگ */
  body::before {
    content: "";
    position: fixed; inset: 0 0 auto 0; height: 260px; z-index: -1;
    background: radial-gradient(60% 100% at 50% 0%, #EDE0F8 0%, #F8F2FC 55%, #FFFFFF 100%);
  }
  .app {
    max-width: 560px; height: 100vh; height: 100dvh;
    margin: 0 auto; display: flex; flex-direction: column;
  }

  /* ---------- هدر ---------- */
  header { position: relative; text-align: center; padding: 20px 20px 10px; }
  .logo { display: block; width: 156px; height: auto; margin: 0 auto; }
  .tagline { margin: 2px 0 0; font-size: .9rem; font-weight: 400; color: var(--plum-deep); }
  .crocus { position: absolute; top: 8px; inset-inline-end: 14px; width: 50px; height: auto; overflow: visible; }
  .crocus .petals { transform-box: fill-box; transform-origin: 50% 100%; animation: bloom 1.3s cubic-bezier(.2,.8,.2,1) .25s both; }
  .crocus .stamens { animation: fade .8s ease 1.1s both; }
  @keyframes bloom { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- گفتگو ---------- */
  #log {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.bot  { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--lilac); color: var(--plum);
    display: grid; place-items: center; margin-bottom: 2px;
  }
  .avatar svg { width: 20px; height: 20px; }
  .bubble {
    padding: 8px 16px; max-width: min(86%, 32rem);
    border-radius: 20px; white-space: pre-line; overflow-wrap: anywhere;
  }
  .bot .bubble  { background: var(--mist); border-end-start-radius: 6px; }
  .user .bubble { background: var(--plum); color: #fff; border-end-end-radius: 6px; }
  .bubble a.inl { color: var(--plum); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rose); }
  .bubble a.inl:hover { color: var(--plum-deep); }
  .bubble a.go {
    display: inline-block; margin-top: 8px; padding: 2px 16px; border-radius: 999px;
    border: 1.5px solid var(--plum); color: var(--plum);
    font-size: .88rem; font-weight: 500; text-decoration: none; white-space: normal;
  }
  .bubble a.go:hover { background: var(--plum); color: #fff; }
  .bubble a.tel { color: var(--plum); font-weight: 500; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }

  .dots { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); animation: bob 1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 70%, 100% { transform: translateY(0); opacity: .5; } 35% { transform: translateY(-5px); opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-inline-start: 38px; }
  .chips small { flex-basis: 100%; color: var(--muted); font-size: .8rem; line-height: 1.6; }
  .chip {
    font: inherit; font-size: .88rem; line-height: 1.7; cursor: pointer; text-align: start;
    padding: 4px 14px; border-radius: 999px; color: var(--ink);
    background: var(--blush); border: 1px solid var(--blush-edge);
    max-width: 100%;
  }
  .chip:hover { background: #F9E1EC; border-color: var(--rose); }

  /* ---------- نوار پیام ---------- */
  .dock { padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #F1E8F7; }
  form { display: flex; gap: 8px; }
  input#q {
    flex: 1; min-width: 0; height: 48px; font: inherit; font-size: 16px; color: var(--ink);
    background: #FCFAFE; border: 1.5px solid var(--lilac); border-radius: 999px; padding: 0 20px;
  }
  input#q::placeholder { color: #A495B0; }
  input#q:focus { border-color: var(--plum); box-shadow: 0 0 0 3px rgba(113, 53, 123, .14); outline: none; }
  button#send {
    flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--plum); color: #fff; display: grid; place-items: center;
  }
  button#send:hover:not(:disabled) { background: var(--plum-deep); }
  button#send:disabled { opacity: .45; cursor: default; }
  button#send svg { width: 22px; height: 22px; }
  .note { margin: 6px 0 0; text-align: center; font-size: .72rem; line-height: 1.7; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .crocus .petals, .crocus .stamens, .dots span { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bloom" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 3C8.5 8 9 13 12 17c3-4 3.500-9 0-14z"/>
    <path fill="currentColor" fill-opacity=".65" d="M5 7c0 5 3 9 7 10-2-4-3.500-8-7-10zM19 7c0 5-3 9-7 10 2-4 3.500-8 7-10z"/>
    <circle cx="12" cy="14" r="1.300" fill="#F2994A"/>
  </symbol>
</svg>

<div class="app">
  <header>
    <svg class="crocus" viewBox="0 0 120 150" aria-hidden="true">
      <defs>
        <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EADDF7"/>
          <stop offset="1" stop-color="#B38BD3"/>
        </linearGradient>
      </defs>
      <path d="M60 150C60 125 58 105 60 82" stroke="#A67FB5" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g class="petals">
        <path d="M60 84C36 62 34 28 52 8 58 28 62 56 60 84z" fill="url(#petal)" opacity=".85"/>
        <path d="M60 84C84 62 86 28 68 8 62 28 58 56 60 84z" fill="url(#petal)" opacity=".85"/>
        <path d="M60 86C43 58 45 24 60 3 75 24 77 58 60 86z" fill="url(#petal)"/>
      </g>
      <g class="stamens" stroke="#F2994A" stroke-width="2.600" stroke-linecap="round" fill="none">
        <path d="M57 82C54 68 52 60 49 53"/>
        <path d="M60 82C60 68 61 58 62 49"/>
        <path d="M63 82C66 70 70 62 74 56"/>
      </g>
    </svg>
    <img class="logo" src="logo.webp" alt="Zuyter" width="440" height="184">
    <p class="tagline">دستیار مهربونِ پوستِ تو</p>
  </header>

  <div id="log" role="log" aria-live="polite" aria-label="گفتگو"></div>

  <div class="dock">
    <form id="form" autocomplete="off">
      <input id="q" type="text" maxlength="300" placeholder="سؤالت رو اینجا بنویس…" aria-label="سؤال شما" enterkeyhint="send" required>
      <button id="send" type="submit" aria-label="ارسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.500 11.500 12 5l6.500 6.500"/></svg>
      </button>
    </form>
    <p class="note">این اطلاعات آموزشی است و جایگزین نظر پزشک یا متخصص پوست نیست.</p>
  </div>
</div>
<noscript><p style="text-align:center">برای استفاده از چت، لطفاً جاوااسکریپت را فعال کن.</p></noscript>

<script>
(() => {
  "use strict";

  // کلید عمومی (publishable): امن است؛ دیتابیس فقط اجازه‌ی صدا زدن ask_skin() را می‌دهد.
  const SUPABASE_URL = "https://dfnvqplwqhuqtfhmpucl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QbC0Hov3a6gfwOcIiDqeHQ_pZs4x1-2";
  const PHONE = "09031464741";

  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("q"), send = $("send");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const scrollDown = () => log.scrollTo({ top: log.scrollHeight, behavior: reduce ? "auto" : "smooth" });

  /* ---------- احوال‌پرسی و گپ دوستانه (بدون تماس با دیتابیس) ---------- */
  const norm = (s) => s.toLowerCase()
    .replace(/ي/g, "ی").replace(/ك/g, "ک")
    .replace(/[ً-ٟـ]/g, "").replace(/[‌‏]/g, " ")
    .replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();

  const GREET = /^(سلام علیکم|سلام|درود|های|هی|hi|hello|صبح بخیر|ظهر بخیر|عصر بخیر|شب بخیر|وقت بخیر)( عزیزم| جان| دوست من)?( |$)/;
  const GREET_REPLIES = [
    "سلام عزیزم! 🌸 خوش اومدی. هر سؤالی درباره‌ی پوستت داری بپرس، با کمال میل کمکت می‌کنم.",
    "سلام قشنگم 💜 خوشحالم که اومدی! پوستت چه سؤالی داره؟",
    "درود بر تو عزیزم 🌸 بپرس، من اینجام که کمکت کنم.",
  ];
  const TALK = [
    [/^(خوبی|خوبین|خوبید|خوب هستی|حالت چطوره|حالتون چطوره|حال شما چطوره|چطوری|چطورین|چطورید|احوالت|احوال شما|چه خبر|چخبر)( عزیزم| جان)?( \S+)?$/,
      ["ممنونم عزیزم، من عالی‌ام 💜 تو چطوری؟ پوستت چه خبر؟ هر سؤالی داری بپرس.",
       "من خوبم، مرسی که پرسیدی 🌸 تو چطوری؟ اگه سؤالی درباره‌ی پوستت داری بگو."]],
    [/^(من )?(خوبم|عالیم|بدک نیستم|مرسی خوبم|ممنون خوبم|منم خوبم|شکر خدا|الحمدلله)( \S+){0,2}$/,
      ["وای چه خوب، خوشحال شدم 😊 اگه سؤالی درباره‌ی پوستت داری بپرس.",
       "عالیه عزیزم 💜 هر وقت خواستی از پوست و محصولات بپرس."]],
    [/^(خیلی )?(ممنون|مرسی|متشکر|تشکر|مچکر|دمت گرم|دستت درد نکنه|دستتون درد نکنه|قربونت|عالی بود|ممنونم|مرسی از)( \S+){0,3}$/,
      ["خواهش می‌کنم عزیزم 🌸 خوشحالم که تونستم کمکت کنم. سؤال دیگه‌ای داشتی بپرس.",
       "قابلی نداشت قشنگم 💜 هر وقت سؤالی داشتی من اینجام."]],
    [/^(خداحافظ|بای|بای بای|فعلا|شب خوش|روز خوش|خدانگهدار|تا بعد|برم)( \S+){0,2}$/,
      ["خداحافظ عزیزم 💜 مراقب پوستت باش و هر وقت خواستی برگرد.",
       "به امید دیدار قشنگم 🌸 روزت پر از شادی!"]],
    [/^(تو کی|شما کی|تو کی هستی|شما کی هستید|اسمت چیه|اسم شما چیه|کی هستی|ربات|تو ربات|شما ربات|هوش مصنوعی)( \S+){0,3}$/,
      ["من دستیار پوست زویترم 🌸 یه ربات مهربونم که با اطلاعات خود برند زویتر به سؤال‌های پوستی جواب می‌دم و محصول مناسبت رو نشونت می‌دم. پزشک نیستم، پس برای مشکل جدی حتماً به متخصص پوست سر بزن."]],
    [/^(کمک|راهنمایی|راهنما|کمکم کن|کمک میخوام|کمک می خوام|چیکار میتونی|چه کاری|چه کارهایی)( \S+){0,3}$/,
      ["حتماً عزیزم 💜 می‌تونی درباره‌ی نوع پوستت، جوش و لک، آبرسانی، روتین مراقبتی یا محصولات زویتر بپرسی. مثلاً بنویس «پوستم همیشه چرب میشه، چیکار کنم؟»"]],
    [/^(ها ?ها+|هه+|خخ+|عاشقتم|دوستت دارم|قشنگی|نازی|مهربونی|عالی|آفرین)( \S+){0,2}$/,
      ["وای مرسی عزیزم، تو لطف داری 💜", "قربونت برم 🌸 تو هم مهربونی!"]],
    [/^(آره|اره|نه|باشه|اوکی|ok|okay|خب|خیلی خب|حله|بله)$/,
      ["باشه عزیزم 💜 هر وقت سؤالی داشتی من اینجام."]],
  ];

  // خروجی: { reply } برای گپ دوستانه، یا { question } برای سؤال واقعی
  function smallTalk(raw) {
    let t = norm(raw);
    if (!t) return { reply: "💜 دیدمش! اگه سؤالی درباره‌ی پوستت داری بنویس تا کمکت کنم." };
    const greeted = GREET.exec(t);
    if (greeted) t = t.slice(greeted[0].length).trim();
    if (!t) return { reply: pick(GREET_REPLIES) };
    if (t.length <= 40) {
      for (const [re, replies] of TALK) {
        if (re.test(t)) return { reply: (greeted ? "سلام عزیزم! " : "") + pick(replies) };
      }
    }
    return { question: greeted ? t : raw.trim() };
  }

  /* ---------- ساخت حباب‌ها ---------- */
  function row(who) {
    const r = document.createElement("div");
    r.className = "row " + who;
    log.appendChild(r);
    return r;
  }
  function avatar() {
    const d = document.createElement("div");
    d.className = "avatar";
    d.setAttribute("aria-hidden", "true");
    d.innerHTML = '<svg viewBox="0 0 24 24"><use href="#bloom"/></svg>';
    return d;
  }
  const PHONE_RE = /(09031464741|۰۹۰۳۱۴۶۴۷۴۱)/;
  const IG_URL = "https://www.instagram.com/zuyter.ir";
  // متن ربات: اسم محصول ([[id|نام]]) و شماره‌ی پشتیبانی و اینستاگرام زویتر لینک می‌شوند.
  // هیچ HTML از سرور وارد صفحه نمی‌شود؛ فقط آدرس‌های zuyter.ir و همین صفحه‌ی اینستاگرام مجازند.
  function richText(text, linkmap) {
    const frag = document.createDocumentFragment();
    const re = /\[\[(\d+)\|([^\]]{1,80})\]\]|(09031464741|۰۹۰۳۱۴۶۴۷۴۱)|(https:\/\/www\.instagram\.com\/zuyter\.ir)/g;
    let last = 0, m;
    const link = (href, label, cls, external) => {
      const a = document.createElement("a");
      a.className = cls;
      a.href = href;
      a.textContent = label;
      if (external) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      return a;
    };
    while ((m = re.exec(text))) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      if (m[1]) {
        const url = linkmap && linkmap[m[1]];
        if (url && SAFE_URL.test(url)) frag.append(link(url, m[2], "inl", true));
        else frag.append(m[2]);
      } else if (m[3]) {
        frag.append(link("tel:" + PHONE, m[3], "inl tel", false));
      } else {
        frag.append(link(IG_URL, "اینستاگرام زویتر", "inl", true));
      }
      last = re.lastIndex;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }
  function bubble(text, rich, linkmap) {
    const b = document.createElement("div");
    b.className = "bubble";
    if (rich) b.append(richText(text, linkmap));
    else b.textContent = text;
    return b;
  }
  function userSay(text) {
    row("user").appendChild(bubble(text));
    scrollDown();
  }
  function botSay(text, ...extras) { return botSayMap(text, null, ...extras); }
  function botSayMap(text, linkmap, ...extras) {
    const r = row("bot");
    r.appendChild(avatar());
    const b = bubble(text, true, linkmap);
    extras.filter(Boolean).forEach((x) => b.appendChild(x));
    r.appendChild(b);
    scrollDown();
    return r;
  }
  function typing() {
    const r = row("bot");
    r.appendChild(avatar());
    const b = document.createElement("div");
    b.className = "bubble dots";
    b.setAttribute("aria-label", "در حال نوشتن");
    b.innerHTML = "<span></span><span></span><span></span>";
    r.appendChild(b);
    scrollDown();
    return r;
  }

  const SAFE_URL = /^https:\/\/(www\.)?zuyter\.ir\//;
  function linkButton(url, category) {
    if (!url || !SAFE_URL.test(url)) return null;
    const wrap = document.createElement("div");
    const a = document.createElement("a");
    a.className = "go";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = category === "محصول" ? "دیدن این محصول در زویتر"
                  : category === "مقاله" ? "خواندن مقاله‌ی کامل"
                  : "مشاهده در سایت زویتر";
    wrap.appendChild(a);
    return wrap;
  }
  function chipList(labels, onPick, title) {
    const box = document.createElement("div");
    box.className = "chips";
    if (title) {
      const s = document.createElement("small");
      s.textContent = title;
      box.appendChild(s);
    }
    labels.forEach((label, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = label;
      b.addEventListener("click", () => onPick(label, i));
      box.appendChild(b);
    });
    log.appendChild(box);
    scrollDown();
    return box;
  }

  function noAnswer() {
    const tel = document.createElement("a");
    tel.className = "tel";
    tel.href = "tel:" + PHONE;
    tel.textContent = PHONE;
    const extra = document.createElement("div");
    extra.append("اگه عجله داری با پشتیبانی زویتر تماس بگیر: ", tel);
    const ig = document.createElement("div");
    ig.append("آخرین تخفیف‌ها و اطلاعات محصولات رو هم می‌تونی تو ", richText(IG_URL), " ببینی 💜");
    extra.append(ig);
    botSay("این یکی رو هنوز جوابش رو ندارم 🙈 ولی سؤالت ثبت شد تا تیم زویتر جوابش رو آماده کنه. اگه با کلمه‌های دیگه‌ای بپرسی، شاید پیداش کنم.", extra);
  }

  /* ---------- ارتباط با دیتابیس ---------- */
  async function ask(q) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/ask_skin", {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ q }),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  /* ---------- مدل زبانی (تابع chat در Supabase)؛ اگر در دسترس نبود null برمی‌گردد ---------- */
  const history = [];
  async function chatLLM(message) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/chat", {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ message, history: history.slice(-6) }),
        signal: ctrl.signal,
      });
      if (!res.ok) return null;
      const d = await res.json();
      return d.mode === "llm" && d.reply ? d : null;
    } catch (_) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }
  function remember(role, text) {
    history.push({ role, text: String(text).slice(0, 600) });
    if (history.length > 12) history.splice(0, history.length - 12);
  }

  let busy = false, starters = null;

  async function handle(raw) {
    const text = raw.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = true;
    input.value = "";
    if (starters) { starters.remove(); starters = null; }
    userSay(text);
    const wait = typing();
    try {
      const llm = await chatLLM(text);
      if (llm) {
        wait.remove();
        const links = (llm.links || []).map((l) => linkButton(l.url, l.category));
        botSayMap(llm.reply, llm.linkmap || {}, ...links);
        remember("user", text);
        remember("bot", llm.reply);
        return;
      }
      // مدل زبانی در دسترس نبود: جستجوی ساده‌ی همیشگی
      const talk = smallTalk(text);
      if (talk.reply) {
        await sleep(reduce ? 0 : 700);
        wait.remove();
        botSay(talk.reply);
      } else {
        const rows = await ask(talk.question);
        wait.remove();
        if (!rows.length) {
          noAnswer();
        } else {
          botSay(rows[0].answer, linkButton(rows[0].url, rows[0].category));
          const more = rows.slice(1);
          if (more.length) {
            chipList(more.map((r) => r.question), (label, i) => {
              userSay(more[i].question);
              botSay(more[i].answer, linkButton(more[i].url, more[i].category));
            }, "اینا رو هم ببین:");
          }
        }
      }
    } catch (err) {
      wait.remove();
      botSay("الان نتونستم وصل بشم عزیزم 🌧️ چند لحظه‌ی دیگه دوباره بپرس.");
    } finally {
      setTimeout(() => { busy = false; send.disabled = false; }, 900);
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); handle(input.value); });

  /* ---------- شروع ---------- */
  botSay("سلام عزیزم! 🌸\nمن دستیار پوست زویترم. هر سؤالی درباره‌ی پوست، جوش، لک، آبرسانی یا محصولات زویتر داری بپرس؛ با کمال میل کمکت می‌کنم 💜");
  const STARTERS = [
    "پوستم همیشه چرب میشه، چیکار کنم؟",
    "تفاوت جای جوش و لک چیه؟",
    "قیمت کرم آبرسان پوست خشک",
    "علت جوش زدن صورت چیه؟",
  ];
  starters = chipList(STARTERS, (label) => handle(label));
})();
</script>
